# Legacy web server for the lab. Every "bad" setting here is on purpose.
server {
    listen 80;
    server_name _;
    server_tokens on;          # shows "nginx/1.18.0" in the Server header
    root /usr/share/nginx/html;
    autoindex on;              # directory listing (look at /backup/)
    # no HSTS, X-Frame-Options, X-Content-Type-Options or CSP headers
}

server {
    listen 443 ssl;
    server_name _;
    server_tokens on;
    root /usr/share/nginx/html;
    autoindex on;

    ssl_certificate     /etc/nginx/certs/cert.pem;   # self-signed, expired 2025-01-01
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;             # old protocols allowed
    ssl_ciphers ALL:@SECLEVEL=0;                     # weak ciphers allowed
    ssl_prefer_server_ciphers off;
}

# Hardened comparison site: a scan here should come back mostly clean (the cert is self-signed)
server {
    listen 8443 ssl;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    autoindex off;

    ssl_certificate     /etc/nginx/certs/good-cert.pem;
    ssl_certificate_key /etc/nginx/certs/good-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
}
