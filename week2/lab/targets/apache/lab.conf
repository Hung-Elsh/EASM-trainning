# Legacy Apache for the lab. Every "bad" setting here is on purpose.
LoadModule dav_module modules/mod_dav.so
LoadModule dav_fs_module modules/mod_dav_fs.so
LoadModule info_module modules/mod_info.so

ServerTokens Full
ServerSignature On
TraceEnable On
DavLockDB /tmp/DavLock

<Directory "/usr/local/apache2/htdocs">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

<Location "/server-status">
    SetHandler server-status
    Require all granted
</Location>

<Location "/server-info">
    SetHandler server-info
    Require all granted
</Location>

# WebDAV with no login: anyone can upload files (only text, nothing here executes them)
Alias "/dav" "/usr/local/apache2/dav"
<Directory "/usr/local/apache2/dav">
    Dav On
    Options Indexes
    Require all granted
</Directory>
