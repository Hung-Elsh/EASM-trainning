// Misconfigured on purpose: open resolver, zone transfers for anyone, version disclosure
options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    recursion yes;
    allow-query { any; };
    allow-recursion { any; };
    allow-transfer { any; };
    version "BIND 9.11.4-lab";
    server-id "seclab-dns-01";
    dnssec-validation no;
};

zone "corp.seclab.test" {
    type master;
    file "/etc/bind/corp.zone";
};
