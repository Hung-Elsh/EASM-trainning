# dnsmasq config for the private lab zone "seclab.test".
# .test is reserved by RFC 2606 -- it can never exist on the real internet.

# --- Safety -----------------------------------------------------------------
listen-address=127.0.0.1   # only Kali itself can query this server
bind-interfaces
no-resolv                  # never forward anything upstream
no-hosts                   # ignore /etc/hosts
local=/seclab.test/        # answer seclab.test from this file only
domain-needed
bogus-priv
# Result: any name outside seclab.test gets REFUSED, so a tool pointed at
# this resolver cannot accidentally resolve (or attack) a real domain.

# --- Logging (watch what your tools ask for) --------------------------------
log-queries
log-facility=/home/elliot/Projects/Security/training/week1/lab/logs/dnsmasq.log

# --- Zone data: every name points ONLY at in-scope IPs ----------------------
host-record=kali.seclab.test,192.168.1.249
host-record=ns1.seclab.test,192.168.1.249
host-record=vpn.seclab.test,192.168.1.249
host-record=jenkins-old.seclab.test,192.168.1.249

host-record=win.seclab.test,192.168.1.250
host-record=www.seclab.test,192.168.1.250
host-record=mail.seclab.test,192.168.1.250
host-record=dev.seclab.test,192.168.1.250
host-record=api.seclab.test,192.168.1.250
host-record=admin.seclab.test,192.168.1.250
host-record=intranet.seclab.test,192.168.1.250
host-record=staging.seclab.test,192.168.1.250
# "Hidden" names that are NOT in common wordlists (lesson: brute force has limits)
host-record=backup-2026.seclab.test,192.168.1.250
host-record=hr-portal-x7.seclab.test,192.168.1.250

cname=ftp.seclab.test,www.seclab.test
cname=webmail.seclab.test,mail.seclab.test

mx-host=seclab.test,mail.seclab.test,10
txt-record=seclab.test,"v=spf1 ip4:192.168.1.248/29 -all"
txt-record=_dmarc.seclab.test,"v=DMARC1; p=none"
# TXT records leak info in real life too -- this one hints at a hidden host
txt-record=seclab.test,"verification=old-hr-portal hr-portal-x7"
srv-host=_http._tcp.seclab.test,www.seclab.test,80
srv-host=_ldap._tcp.seclab.test,win.seclab.test,389
